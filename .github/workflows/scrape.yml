name: Update Bin Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Install Playwright Python bindings
      - name: Install Playwright
        run: pip install playwright

      - name: Install Playwright Browsers
        run: playwright install --with-deps

      # ⭐ THIS GOES HERE — directly before Run scraper
      - name: Start virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99

      - name: Run scraper
        run: |
          python scraper/scrape.py || true

      # Always commit debug.html even if scraper crashed
      - name: Commit debug output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add BAE debug file
          if [ -f docs/debug.html ]; then
            git add docs/debug.html
          fi

          # Add AAE debug file
          if [ -f docs/aae_debug.html ]; then
            git add docs/aae_debug.html
          fi

          # Add screenshots if they exist
          if [ -f docs/bae.png ]; then
            git add docs/bae.png
          fi

          if [ -f docs/aae.png ]; then
            git add docs/aae.png
          fi

          # Add next.json
          if [ -f docs/next.json ]; then
            git add docs/next.json
          fi

          git commit -m "Update debug and output files" || echo "No changes to commit"
          git push
