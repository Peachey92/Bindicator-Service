name: Update Bin Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # Run once daily at 06:00

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: pip install playwright

      - name: Install Playwright Browsers
        run: playwright install --with-deps

      - name: Start virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run scraper
        run: |
          python scraper/scrape.py || true

      - name: Commit Bindicator output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Commit next.json if present
          if [ -f docs/next.json ]; then
            git add docs/next.json
          fi

          # Commit raw AAE HTML if present
          if [ -f docs/aae_raw.html ]; then
            git add docs/aae_raw.html
          fi

          # Commit fallback debug file only if AAE failed
          if [ -f docs/aae_failed.html ]; then
            git add docs/aae_failed.html
          fi

          git commit -m "Update Bindicator output" || echo "No changes to commit"
          git push
