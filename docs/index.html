<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bindicator</title>

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: auto;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    padding: 15px;
    margin: 10px 0;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.bin-name {
    font-size: 1.2em;
    font-weight: bold;
}

.date {
    color: #555;
}

.last-updated {
    text-align: center;
    color: #888;
    font-size: 0.8em;
    margin-top: 25px;
}

</style>
</head>

<body>

<h1>🗑️ Bindicator</h1>

<div id="schedule">
    Loading collection schedule...
</div>

<div id="lastUpdated" class="last-updated"></div>

<script>

async function loadSchedule() {

    const response = await fetch('schedule.json');
    const data = await response.json();

    const scheduleDiv = document.getElementById('schedule');

    scheduleDiv.innerHTML = '';

    const sortedBins = Object.entries(data.bins)
        .sort((a, b) => new Date(a[1]) - new Date(b[1]));

    for (const [bin, date] of sortedBins) {

        const card = document.createElement('div');

        card.className = 'card';

        card.innerHTML = `
            <div class="bin-name">${bin}</div>
            <div class="date">
                ${new Date(date).toLocaleDateString(
                    'en-GB',
                    {
                        weekday: 'long',
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric'
                    }
                )}
            </div>
        `;

        scheduleDiv.appendChild(card);
    }

    document.getElementById('lastUpdated').innerHTML =
        'Last updated: ' +
        new Date(data.updated).toLocaleString('en-GB');
}

loadSchedule();

</script>

</body>
</html>
